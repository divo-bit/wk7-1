<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초등 3학년 영어 단어 모험 🌟</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --dark: #2C3E50;
            --light: #F7F9FC;
            --card-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Gamja Flower', 'Pretendard', 'Comic Sans MS', cursive, sans-serif;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #a8edf0 0%, #fed6e3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            color: var(--dark);
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            overflow: hidden;
            border: 4px solid #fff;
            position: relative;
            min-height: 640px;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background: #FFF;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #E2E8F0;
        }

        .home-btn {
            background: var(--light);
            border: 2px solid #CBD5E1;
            border-radius: 12px;
            padding: 6px 12px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .home-btn:active { transform: scale(0.95); }

        .score-board {
            font-size: 1.2rem;
            font-weight: bold;
            color: #FF8E53;
            background: #FFF5F0;
            padding: 6px 14px;
            border-radius: 20px;
            border: 2px solid #FFD8C2;
        }

        /* Main Content Views */
        .view {
            display: none;
            padding: 20px;
            flex: 1;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .view.active {
            display: flex;
        }

        /* Title Screen */
        .title-screen h1 {
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px #FFF;
            text-align: center;
        }

        .title-screen p {
            font-size: 1.1rem;
            color: #64748B;
            margin-bottom: 25px;
            text-align: center;
        }

        .stage-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
        }

        .stage-card {
            background: white;
            border-radius: 20px;
            padding: 20px 10px;
            text-align: center;
            box-shadow: var(--card-shadow);
            border: 3px solid #E2E8F0;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .stage-card:hover {
            transform: translateY(-5px);
            border-color: var(--secondary);
        }

        .stage-card.completed {
            border-color: #48BB78;
            background: #F0FFF4;
        }

        .stage-number {
            font-size: 1rem;
            font-weight: bold;
            color: #94A3B8;
        }

        .stage-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin: 5px 0;
            color: var(--dark);
        }

        .stage-stars {
            font-size: 1.2rem;
            color: #CBD5E1;
        }

        .stage-stars.earned {
            color: #F6AD55;
        }

        /* Learning Stage Cards */
        .progress-bar {
            width: 100%;
            height: 12px;
            background: #E2E8F0;
            border-radius: 6px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--secondary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .word-card {
            background: white;
            width: 100%;
            border-radius: 24px;
            box-shadow: var(--card-shadow);
            padding: 30px 20px;
            text-align: center;
            border: 3px solid #EDF2F7;
            margin-bottom: 20px;
            position: relative;
        }

        .word-emoji {
            font-size: 5rem;
            margin-bottom: 10px;
            display: block;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .word-en {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary);
            letter-spacing: 1px;
        }

        .word-kr {
            font-size: 1.5rem;
            color: #718096;
            margin-top: 5px;
        }

        .sound-btn {
            background: #EBF8FF;
            border: 2px solid #BEE3F8;
            color: #2B6CB0;
            font-size: 1.2rem;
            padding: 8px 16px;
            border-radius: 20px;
            margin-top: 15px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* Buttons */
        .action-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 18px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #E53E3E;
            transition: all 0.1s;
        }

        .action-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        /* Game 1: Matching */
        .match-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            margin-bottom: 15px;
        }

        .match-card {
            background: white;
            border: 2px solid #CBD5E1;
            border-radius: 16px;
            padding: 15px 10px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .match-card.selected {
            border-color: #3182CE;
            background: #EBF8FF;
            transform: scale(1.02);
        }

        .match-card.matched {
            visibility: hidden;
        }

        /* Game 2: Quiz */
        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            margin-top: 20px;
        }

        .quiz-opt {
            background: white;
            border: 2px solid #E2E8F0;
            padding: 16px;
            border-radius: 16px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .quiz-opt:active {
            background: #F7FAFC;
        }

        /* Sticker Modal/View */
        .sticker-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: 100%;
            margin-top: 15px;
            background: #FFF;
            padding: 15px;
            border-radius: 20px;
            border: 2px dashed #CBD5E1;
        }

        .sticker-slot {
            aspect-ratio: 1;
            background: var(--light);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            filter: grayscale(100%);
            opacity: 0.3;
        }

        .sticker-slot.unlocked {
            filter: grayscale(0%);
            opacity: 1;
            animation: pop 0.4s ease;
        }

        @keyframes pop {
            0% { transform: scale(0.5); }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 10;
        }

        .modal-card {
            background: white;
            border-radius: 24px;
            padding: 25px;
            text-align: center;
            width: 100%;
            animation: modalUp 0.3s ease;
        }

        @keyframes modalUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .badge-icon {
            font-size: 4rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Top Header -->
    <header>
        <button class="home-btn" onclick="showView('title-screen')">🏠 홈</button>
        <div class="score-board">⭐ 스티커 <span id="sticker-count">0</span>/20</div>
    </header>

    <!-- 1. 메인 스테이지 선택 화면 -->
    <div id="title-screen" class="view active title-screen">
        <h1>초등 3학년 영어 탐험대 🎈</h1>
        <p>하루 5단어씩, 신나게 익혀보아요!</p>
        
        <div class="stage-grid">
            <div class="stage-card" onclick="startStage(0)">
                <div class="stage-number">STAGE 1</div>
                <div class="stage-title">🐱 귀여운 동물</div>
                <div class="stage-stars" id="star-0">☆☆☆</div>
            </div>
            <div class="stage-card" onclick="startStage(1)">
                <div class="stage-number">STAGE 2</div>
                <div class="stage-title">✏️ 내 학용품</div>
                <div class="stage-stars" id="star-1">☆☆☆</div>
            </div>
            <div class="stage-card" onclick="startStage(2)">
                <div class="stage-number">STAGE 3</div>
                <div class="stage-title">👨‍👩‍👧 가족과 친구</div>
                <div class="stage-stars" id="star-2">☆☆☆</div>
            </div>
            <div class="stage-card" onclick="startStage(3)">
                <div class="stage-number">STAGE 4</div>
                <div class="stage-title">🎨 색상과 상태</div>
                <div class="stage-stars" id="star-3">☆☆☆</div>
            </div>
        </div>

        <button class="action-btn" style="margin-top: 25px; background: #3182CE; box-shadow: 0 4px 0 #2B6CB0;" onclick="showStickerBook()">
            🎁 스티커 북 보기
        </button>
    </div>

    <!-- 2. Step 1: 단어 카드 학습 -->
    <div id="learn-screen" class="view">
        <div class="progress-bar"><div class="progress-fill" id="learn-progress"></div></div>
        <div style="font-size: 1.1rem; color: #718096; margin-bottom: 10px;">1단계: 카드 살펴보기</div>
        
        <div class="word-card">
            <span class="word-emoji" id="learn-emoji">🐱</span>
            <div class="word-en" id="learn-en">cat</div>
            <div class="word-kr" id="learn-kr">고양이</div>
            <button class="sound-btn" onclick="speakCurrentWord()">🔊 소리 듣기</button>
        </div>

        <button class="action-btn" onclick="nextLearnCard()">다음 단어 ➔</button>
    </div>

    <!-- 3. Step 2: 짝 맞추기 미니 게임 -->
    <div id="match-screen" class="view">
        <div style="font-size: 1.1rem; color: #718096; margin-bottom: 15px;">2단계: 그림과 단어 짝 맞추기!</div>
        <div class="match-grid" id="match-grid"></div>
    </div>

    <!-- 4. Step 3: 듣기 퀴즈 -->
    <div id="quiz-screen" class="view">
        <div class="progress-bar"><div class="progress-fill" id="quiz-progress"></div></div>
        <div style="font-size: 1.1rem; color: #718096; margin-bottom: 10px;">3단계: 소리를 듣고 맞혀봐요!</div>
        
        <button class="sound-btn" style="font-size: 1.5rem; padding: 12px 24px; margin-bottom: 15px;" onclick="speakQuizWord()">🔊 소리 다시 듣기</button>
        
        <div class="quiz-options" id="quiz-options"></div>
    </div>

    <!-- 5. 스티커 북 화면 -->
    <div id="sticker-screen" class="view">
        <h2 style="color: var(--primary);">나의 모은 스티커 🎨</h2>
        <p style="color: #718096; margin-bottom: 10px;">단어를 외우면 스티커가 채워져요!</p>
        <div class="sticker-grid" id="sticker-grid"></div>
        <button class="action-btn" style="margin-top: 20px;" onclick="showView('title-screen')">돌아가기</button>
    </div>

    <!-- Modal: 스테이지 완료 보상 -->
    <div class="modal-overlay" id="reward-modal">
        <div class="modal-card">
            <div class="badge-icon">🏆</div>
            <h2 style="color: var(--primary); margin-bottom: 10px;">축하합니다!</h2>
            <p id="modal-desc" style="color: #4A5568; margin-bottom: 20px;">스테이지를 완료했어요!</p>
            <button class="action-btn" onclick="closeRewardModal()">완료!</button>
        </div>
    </div>
</div>

<script>
    // 20개 단어 데이터 (4개 스테이지 x 5개 단어)
    const stages = [
        {
            title: "귀여운 동물",
            words: [
                { en: "cat", kr: "고양이", emoji: "🐱" },
                { en: "dog", kr: "강아지", emoji: "🐶" },
                { en: "bird", kr: "새", emoji: "🐦" },
                { en: "apple", kr: "사과", emoji: "🍎" },
                { en: "banana", kr: "바나나", emoji: "🍌" }
            ]
        },
        {
            title: "내 학용품",
            words: [
                { en: "book", kr: "책", emoji: "📖" },
                { en: "desk", kr: "책상", emoji: "🪑" },
                { en: "pencil", kr: "연필", emoji: "✏️" },
                { en: "car", kr: "자동차", emoji: "🚗" },
                { en: "bus", kr: "버스", emoji: "🚌" }
            ]
        },
        {
            title: "가족과 친구",
            words: [
                { en: "mom", kr: "엄마", emoji: "👩" },
                { en: "dad", kr: "아빠", emoji: "👨" },
                { en: "friend", kr: "친구", emoji: "🧑‍🤝‍🧑" },
                { en: "boy", kr: "남자아이", emoji: "👦" },
                { en: "girl", kr: "여자아이", emoji: "👧" }
            ]
        },
        {
            title: "색상과 상태",
            words: [
                { en: "red", kr: "빨간색", emoji: "🔴" },
                { en: "blue", kr: "파란색", emoji: "🔵" },
                { en: "happy", kr: "행복한", emoji: "😊" },
                { en: "big", kr: "큰", emoji: "🐘" },
                { en: "sun", kr: "해", emoji: "☀️" }
            ]
        }
    ];

    // 앱 상태
    let currentStageIndex = 0;
    let currentLearnIndex = 0;
    let currentQuizIndex = 0;
    let learnedWords = new Set();
    let stageStars = [0, 0, 0, 0];

    // 음성 합성 (TTS)
    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.8; // 아이들이 듣기 편하게 살짝 천천히
            window.speechSynthesis.speak(utterance);
        }
    }

    // 화면 전환
    function showView(viewId) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        updateHeader();
    }

    function updateHeader() {
        document.getElementById('sticker-count').innerText = learnedWords.size;
        
        // 별표 표시 업데이트
        stageStars.forEach((stars, idx) => {
            const el = document.getElementById(`star-${idx}`);
            if (el) {
                el.innerText = "★".repeat(stars) + "☆".repeat(3 - stars);
                if (stars > 0) el.classList.add('earned');
            }
        });
    }

    // 스테이지 시작
    function startStage(stageIdx) {
        currentStageIndex = stageIdx;
        currentLearnIndex = 0;
        showView('learn-screen');
        loadLearnCard();
    }

    // 1. 단어 카드 학습
    function loadLearnCard() {
        const words = stages[currentStageIndex].words;
        const word = words[currentLearnIndex];
        
        document.getElementById('learn-emoji').innerText = word.emoji;
        document.getElementById('learn-en').innerText = word.en;
        document.getElementById('learn-kr').innerText = word.kr;
        
        const progress = ((currentLearnIndex + 1) / words.length) * 100;
        document.getElementById('learn-progress').style.width = `${progress}%`;
        
        speak(word.en);
    }

    function speakCurrentWord() {
        const word = stages[currentStageIndex].words[currentLearnIndex];
        speak(word.en);
    }

    function nextLearnCard() {
        const words = stages[currentStageIndex].words;
        currentLearnIndex++;
        if (currentLearnIndex < words.length) {
            loadLearnCard();
        } else {
            // 카드 학습 완료 후 Match Game으로 이동
            startMatchGame();
        }
    }

    // 2. 짝 맞추기 게임
    let selectedCards = [];
    function startMatchGame() {
        showView('match-screen');
        const words = stages[currentStageIndex].words;
        const grid = document.getElementById('match-grid');
        grid.innerHTML = '';
        selectedCards = [];

        // 카드 생성 (영어 카드 + 한국어 카드)
        let cardsData = [];
        words.forEach(w => {
            cardsData.push({ id: w.en, text: w.en, type: 'en' });
            cardsData.push({ id: w.en, text: `${w.emoji} ${w.kr}`, type: 'kr' });
        });

        // 섞기
        cardsData.sort(() => Math.random() - 0.5);

        cardsData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'match-card';
            card.innerText = item.text;
            card.dataset.id = item.id;
            card.onclick = () => handleMatchSelect(card);
            grid.appendChild(card);
        });
    }

    function handleMatchSelect(card) {
        if (card.classList.contains('matched') || card.classList.contains('selected')) return;

        if (card.innerText.match(/[a-zA-Z]/)) {
            speak(card.innerText);
        }

        card.classList.add('selected');
        selectedCards.push(card);

        if (selectedCards.length === 2) {
            const [c1, c2] = selectedCards;
            if (c1.dataset.id === c2.dataset.id) {
                // 정답!
                setTimeout(() => {
                    c1.classList.add('matched');
                    c2.classList.add('matched');
                    selectedCards = [];
                    checkMatchWin();
                }, 400);
            } else {
                // 오답
                setTimeout(() => {
                    c1.classList.remove('selected');
                    c2.classList.remove('selected');
                    selectedCards = [];
                }, 600);
            }
        }
    }

    function checkMatchWin() {
        const remaining = document.querySelectorAll('.match-card:not(.matched)');
        if (remaining.length === 0) {
            setTimeout(() => {
                startQuizGame();
            }, 500);
        }
    }

    // 3. 듣기 퀴즈
    function startQuizGame() {
        showView('quiz-screen');
        currentQuizIndex = 0;
        loadQuiz();
    }

    function loadQuiz() {
        const words = stages[currentStageIndex].words;
        const currentWord = words[currentQuizIndex];
        
        const progress = ((currentQuizIndex + 1) / words.length) * 100;
        document.getElementById('quiz-progress').style.width = `${progress}%`;

        const optionsContainer = document.getElementById('quiz-options');
        optionsContainer.innerHTML = '';

        // 보기 3개 생성 (정답 1 + 보기 2)
        let options = [currentWord];
        let otherWords = words.filter(w => w.en !== currentWord.en);
        otherWords.sort(() => Math.random() - 0.5);
        options.push(otherWords[0], otherWords[1]);
        options.sort(() => Math.random() - 0.5);

        options.forEach(opt => {
            const btn = document.createElement('div');
            btn.className = 'quiz-opt';
            btn.innerHTML = `<span>${opt.emoji} ${opt.kr}</span> <span>➔</span>`;
            btn.onclick = () => handleQuizAnswer(opt.en === currentWord.en, btn);
            optionsContainer.appendChild(btn);
        });

        speak(currentWord.en);
    }

    function speakQuizWord() {
        const currentWord = stages[currentStageIndex].words[currentQuizIndex];
        speak(currentWord.en);
    }

    function handleQuizAnswer(isCorrect, element) {
        if (isCorrect) {
            element.style.borderColor = '#48BB78';
            element.style.background = '#F0FFF4';
            
            // 단어 학습 완료 등록
            learnedWords.add(stages[currentStageIndex].words[currentQuizIndex].en);
            
            setTimeout(() => {
                currentQuizIndex++;
                if (currentQuizIndex < stages[currentStageIndex].words.length) {
                    loadQuiz();
                } else {
                    finishStage();
                }
            }, 600);
        } else {
            element.style.borderColor = '#E53E3E';
            element.style.background = '#FFF5F5';
            setTimeout(() => {
                element.style.borderColor = '#E2E8F0';
                element.style.background = 'white';
            }, 600);
        }
    }

    // 스테이지 완료
    function finishStage() {
        stageStars[currentStageIndex] = 3; // 별 3개 획득
        updateHeader();
        
        document.getElementById('modal-desc').innerText = `'${stages[currentStageIndex].title}' 스테이지의 단어 5개를 완벽하게 외웠어요! 스티커 5개를 선물로 드립니다! 🎁`;
        document.getElementById('reward-modal').style.display = 'flex';
    }

    function closeRewardModal() {
        document.getElementById('reward-modal').style.display = 'none';
        showView('title-screen');
    }

    // 스티커북 보기
    function showStickerBook() {
        showView('sticker-screen');
        const grid = document.getElementById('sticker-grid');
        grid.innerHTML = '';

        // 20개 단어 전체 순회
        stages.forEach(stage => {
            stage.words.forEach(word => {
                const slot = document.createElement('div');
                const isUnlocked = learnedWords.has(word.en);
                slot.className = `sticker-slot ${isUnlocked ? 'unlocked' : ''}`;
                slot.innerText = word.emoji;
                slot.title = isUnlocked ? `${word.en} (${word.kr})` : "미해금";
                grid.appendChild(slot);
            });
        });
    }

    // 초기화
    updateHeader();
</script>
</body>
</html>
